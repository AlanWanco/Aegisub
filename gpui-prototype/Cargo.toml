[package]
name = "aegisub-gpui-prototype"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui-kit = { version = "0.6.6", features = ["component"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
async-net = "2"
futures-lite = "2"
base64 = "0.22"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"
